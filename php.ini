memory_limit=8M
post_max_size=8M
upload_max_filesize=2M
max_file_uploads=20
display_errors=Off
display_startup_errors=Off
log_errors=On
output_buffering=Off
implicit_flush=On
zend_extension=opcache
opcache.enable=1
opcache.validate_timestamps=0
session.upload_progress.enabled=On
session.upload_progress.name=P

