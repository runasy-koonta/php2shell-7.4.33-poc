name: php2shell-7433-port

services:
  php:
    build: .
    image: php2shell-7433-port:local
    ports:
      - "127.0.0.1:${PHP2SHELL_PORT:-17433}:80"
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - ./html:/var/www/html:ro
      - ./php.ini:/usr/local/etc/php/conf.d/zz-lab.ini:ro
      - ./mpm_prefork.conf:/etc/apache2/mods-enabled/mpm_prefork.conf:ro
